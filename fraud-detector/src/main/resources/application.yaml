spring:
  application:
    name: fraud-detector
  datasource:
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    url: jdbc:clickhouse://localhost:8123/transactions
    username: default
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-detector-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ru.yanin.shared."
        spring.json.value.default.type: ru.yanin.shared.domain.TransactionEvent
        max.poll.records: 100
        fetch.min.bytes: 1024
        fetch.max.wait.ms: 5000
        session.timeout.ms: 30000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      retries: 3
      acks: all
    listener:
      ack-mode: manual
      concurrency: 15
      missing-topics-fatal: false
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password123

app:
  kafka:
    topics:
      raw-transactions: raw-transactions
      alert: fraud-alerts

executor:
  transaction:
    producer:
      nThread: 7
      thread:
        name: alert-producer-worker

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  metrics:
    tags:
      application: fraud-detector
      environment: dev
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: info
  pattern:
    console: '%d{dd.MM.yyyy HH:mm:ss.SSS} [%thread] %clr(%-5level) %logger{36} - %msg%n'